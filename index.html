<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Aparecida 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff4d6d,#ff8fa3,#ffc2d1);
    font-family:'Poppins',sans-serif;
    position:relative;
}

/* CORAÇÕES */
.heart{
    position:absolute;
    color:white;
    font-size:20px;
    animation:subir linear infinite;
    opacity:0.7;
}

@keyframes subir{
    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-120px) scale(1.2);
        opacity:0;
    }
}

/* CAIXA */
.container{
    text-align:center;
    padding:40px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,0,0,0.2);
    animation:entrada 2s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:scale(0.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

h2{
    color:white;
    font-size:35px;
    margin-bottom:15px;
    font-family:'Great Vibes',cursive;
}

h1{
    color:white;
    font-size:55px;
    text-shadow:0 0 15px rgba(0,0,0,0.3);
    animation:flutuar 2s infinite ease-in-out;
}

@keyframes flutuar{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

p{
    margin-top:20px;
    color:white;
    font-size:18px;
}

/* RESPONSIVO */
@media(max-width:600px){
    h1{
        font-size:38px;
    }

    h2{
        font-size:28px;
    }

    p{
        font-size:15px;
    }
}
</style>
</head>

<body>

<!-- Música -->
<audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-love-11786.mp3" type="audio/mp3">
</audio>

<!-- Corações -->
<script>
for(let i = 0; i < 35; i++){
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(heart);
}
</script>

<!-- Conteúdo -->
<div class="container">
    <h2>Para Aparecida 💌</h2>

    <h1>
        Você aceita<br>
        namorar comigo? 💖
    </h1>

    <p>
        Desde que te conheci, tudo ficou mais bonito ✨
    </p>
</div>

</body>
</html>
